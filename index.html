<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha D&D 5.5</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="ficha">

        <header class="cabecera">
            <div>
                <h1>Ficha de personaje</h1>
            </div>
            <div class="marca-edicion">5.5</div>
        </header>

        <section class="panel datos-personaje">

            <div class="campo campo-grande">
                <label for="nombre">Nombre del personaje</label>
                <input type="text" id="nombre" autocomplete="off">
            </div>

            <div class="campo">
                <label for="clase">Clase</label>
                <input type="text" id="clase" autocomplete="off">
            </div>

            <div class="campo campo-nivel">
                <label for="nivel">Nivel</label>
                <input type="number" id="nivel" min="1" max="20" value="1">
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
