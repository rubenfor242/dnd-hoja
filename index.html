<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de personaje 5.5</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="ficha">

        <header class="cabecera">
            <div>
                <h1>Ficha de personaje</h1>
            </div>

            <div class="marca-edicion">5.5</div>
        </header>

        <section class="panel datos-personaje">

            <div class="campo campo-nombre">
                <label for="nombre">Nombre del personaje</label>
                <input type="text" id="nombre" autocomplete="off">
            </div>

            <div class="campo">
                <label for="trasfondo">Trasfondo</label>
                <input type="text" id="trasfondo" autocomplete="off">
            </div>

            <div class="campo">
                <label for="clase">Clase</label>
                <input type="text" id="clase" autocomplete="off">
            </div>

            <div class="campo">
                <label for="especie">Especie</label>
                <input type="text" id="especie" autocomplete="off">
            </div>

            <div class="campo">
                <label for="subclase">Subclase</label>
                <input type="text" id="subclase" autocomplete="off">
            </div>

        </section>

        <section class="panel bloque-progreso">

            <div class="bloque-nivel">

                <div class="campo">
                    <label for="modoProgreso">Modo de progreso</label>

                    <select id="modoProgreso">
                        <option value="px">PX</option>
                        <option value="hitos">Hitos</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nivel">Nivel</label>

                    <input type="number" id="nivel" min="1" max="20" value="1">
                </div>

                <div class="campo campo-px" id="campoPx">
                    <label for="px">PX</label>

                    <input type="number" id="px" min="0" max="355000" value="0">
                </div>

                <div class="campo">
                    <label>Bonificador por competencia</label>

                    <div class="valor-estatico" id="competencia">
                        +2
                    </div>
                </div>

            </div>

            <div class="tabla-px" id="tablaPxContenedor">

                <h2>PX mínimos por nivel</h2>

                <div class="tabla-px-grid" id="tablaPx"></div>

            </div>

        </section>

        <section class="panel bloque-defensa">

            <div class="bloque-ca">

                <div class="campo">
                    <label for="caBase">CA base <span class="nota-label">(10 o armadura)</span></label>
                    <input type="number" id="caBase" min="0" max="99" value="10">

                    <div class="competencias-armadura">

                        <div class="competencia-armadura">
                            <button type="button" class="competencia-btn"></button>
                            <span>Ligeras</span>
                        </div>

                        <div class="competencia-armadura">
                            <button type="button" class="competencia-btn"></button>
                            <span>Medias</span>
                        </div>

                        <div class="competencia-armadura">
                            <button type="button" class="competencia-btn"></button>
                            <span>Pesadas</span>
                        </div>

                        <div class="competencia-armadura">
                            <button type="button" class="competencia-btn"></button>
                            <span>Escudos</span>
                        </div>

                    </div>

                </div>

                <div class="campo campo-escudo">
                    <label>Escudo <span class="nota-label">(+2 CA)</span></label>

                    <button type="button" class="competencia-btn escudo-btn" id="botonEscudo"></button>
                </div>

                <div class="campo campo-ca-total">
                    <label>CA total <span class="nota-label" id="notaCaTotal">(base + DES + mods.)</span></label>

                    <div class="valor-estatico" id="caTotal">
                        10
                    </div>

                    <div class="subcampo-ca">
                        <label for="tipoArmadura">Tipo de armadura</label>

                        <select id="tipoArmadura">
                            <option value="sin">Sin armadura</option>
                            <option value="ligera">Ligera</option>
                            <option value="media">Media</option>
                            <option value="pesada">Pesada</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="separador-bloque"></div>

            <div class="bloque-pg">

                <div class="campo">
                    <label for="pgActuales">PG actuales</label>

                    <input
                        type="number"
                        id="pgActuales"
                        min="0"
                        max="999"
                        value="0"
                    >
                </div>

                <div class="campo">
                    <label for="pgMaximos">PG máximos</label>

                    <input
                        type="number"
                        id="pgMaximos"
                        min="0"
                        max="999"
                        value="0"
                    >
                </div>

                <div class="campo">
                    <label for="pgTemporales">PG temporales</label>

                    <input
                        type="number"
                        id="pgTemporales"
                        min="0"
                        max="999"
                        value="0"
                    >
                </div>

            </div>

            <div class="separador-bloque"></div>

            <div class="bloque-dados-golpe">

                <div class="campo">
                    <label for="dadosGolpeGastados">DG gastados</label>

                    <input
                        type="number"
                        id="dadosGolpeGastados"
                        min="0"
                        max="99"
                        value="0"
                    >
                </div>

                <div class="campo">
                    <label for="dadosGolpeMaximos">DG máximos</label>

                    <input
                        type="number"
                        id="dadosGolpeMaximos"
                        min="0"
                        max="99"
                        value="0"
                    >
                </div>

            </div>

            <div class="separador-bloque"></div>

            <div class="bloque-muerte">

                <h2>Salvaciones contra muerte</h2>

                <div class="fila-muerte" data-tipo="exitos">
                    <button type="button" class="boton-muerte" data-tipo="exitos">
                        Éxitos
                    </button>

                    <div class="circulos-muerte">
                        <span class="competencia-btn muerte-circulo"></span>
                        <span class="competencia-btn muerte-circulo"></span>
                        <span class="competencia-btn muerte-circulo"></span>
                    </div>
                </div>

                <div class="fila-muerte" data-tipo="fallos">
                    <button type="button" class="boton-muerte" data-tipo="fallos">
                        Fallos
                    </button>

                    <div class="circulos-muerte">
                        <span class="competencia-btn muerte-circulo"></span>
                        <span class="competencia-btn muerte-circulo"></span>
                        <span class="competencia-btn muerte-circulo"></span>
                    </div>
                </div>

                <button type="button" class="boton-reiniciar-muerte" id="reiniciarMuerte">
                    Reiniciar salvaciones
                </button>

            </div>

        </section>

        <section class="panel bloque-estado">

            <div class="estado-campo">

                <label>Iniciativa</label>

                <div class="valor-estatico" id="iniciativa">
                    1D20+0
                </div>

            </div>

            <div class="estado-campo">

                <label for="velocidad">Velocidad</label>

                <div class="campo-velocidad">
                    <input
                        type="number"
                        id="velocidad"
                        min="0"
                        max="999"
                        value="9"
                    >

                    <span class="sufijo-velocidad">m.</span>
                </div>

            </div>

            <div class="estado-campo">

                <label for="tamano">Tamaño</label>

                <select id="tamano">
                    <option value="Diminuto">Diminuto</option>
                    <option value="Pequeño">Pequeño</option>
                    <option value="Mediano" selected>Mediano</option>
                    <option value="Grande">Grande</option>
                    <option value="Enorme">Enorme</option>
                    <option value="Gargantuesco">Gargantuesco</option>
                </select>

            </div>

            <div class="estado-campo">

                <label>Percepción pasiva</label>

                <div class="valor-estatico" id="percepcionPasiva">
                    10
                </div>

            </div>

            <div class="estado-campo inspiracion-campo">

                <label>Inspiración heroica</label>

                <button type="button" id="botonInspiracion">
                    ★
                </button>

            </div>

        </section>

        <section class="bloque-atributos">

            <!-- FUERZA -->
            <section class="panel atributo-card">

                <div class="atributo-cabecera">
                    <h2>Fuerza</h2>

                    <div class="atributo-valores">

                        <div class="atributo-modificador" id="mod-fue">
                            +0
                        </div>

                        <div class="atributo-puntuacion">

                            <label for="fue">Puntuación</label>

                            <select id="fue">
				<option value="3">3</option>
    				<option value="4">4</option>
 				<option value="5">5</option>
			        <option value="6">6</option>
				<option value="7">7</option>
				<option value="8" selected>8</option>
				<option value="9">9</option>
				<option value="10">10</option>
				<option value="11">11</option>
				<option value="12">12</option>
				<option value="13">13</option>
				<option value="14">14</option>
				<option value="15">15</option>
				<option value="16">16</option>
 				<option value="17">17</option>
				<option value="18">18</option>
				<option value="19">19</option>
				<option value="20">20</option>
			    </select>
                            
                        </div>

                    </div>
                </div>

                <div class="atributo-lineas">

                    <button class="linea-habilidad">

                        <div class="linea-izquierda">

                            <div
                                class="competencia-btn"
                                data-atributo="fue"
                                data-habilidad="salvacion"
                            ></div>

                            <span>Tirada de salvación</span>

                        </div>

                        <span
                            class="valor-habilidad"
                            id="salvacion-fue"
                        >
                            +0
                        </span>

                    </button>

                    <button class="linea-habilidad">

                        <div class="linea-izquierda">

                            <div
                                class="competencia-btn"
                                data-atributo="fue"
                                data-habilidad="atletismo"
                            ></div>

                            <span>Atletismo</span>

                        </div>

                        <span
                            class="valor-habilidad"
                            id="habilidad-atletismo"
                        >
                            +0
                        </span>

                    </button>

                </div>

            </section>

                        <span

                            id="habilidad-acrobacias"
                        >
                            +0
                        </span>

                    </button>

                    <button class="linea-habilidad">

                        <div class="linea-izquierda">

                            <div
                                class="competencia-btn"
                                data-atributo="des"
                                data-habilidad="juego-manos"
                            ></div>

                            <span>Juego de manos</span>

                        </div>

                        <span
                            class="valor-habilidad"
                            id="habilidad-juego-manos"
                        >
                            +0
                        </span>

                    </button>

                    <button class="linea-habilidad">

                        <div class="linea-izquierda">

                            <div
                                class="competencia-btn"
                                data-atributo="des"
                                data-habilidad="sigilo"
                            ></div>

                            <span>Sigilo</span>

                        </div>

                        <span
                            class="valor-habilidad"
                            id="habilidad-sigilo"
                        >
                            +0
                        </span>

                    </button>

                </div>

            </section>

            <!-- CONSTITUCIÓN -->
            <section class="panel atributo-card">

                <div class="atributo-cabecera">
                    <h2>Constitución</h2>

                    <div class="atributo-valores">

                        <div class="atributo-modificador" id="mod-con">

                        </div>

                        <div class="atributo-puntuacion">

                            <label for="con">Puntuación</label>

                            <select id="con">
				<option value="3">3</option>
    				<option value="4">4</option>
 				<option value="5">5</option>
			        <option value="6">6</option>
				<option value="7">7</option>
				<option value="8" selected>8</option>

				<option value="11">11</option>
				<option value="12">12</option>
				<option value="13">13</option>
				<option value="14">14</option>
				<option value="15">15</option>
				<option value="16">16</option>
 				<option value="17">17</option>
				<option value="18">18</option>
				<option value="19">19</option>
				<option value="20">20</option>
			    </select>

                        </div>

                    </div>
                </div>

                <div class="atributo-lineas">

                    <button class="linea-habilidad">

                        <div class="linea-izquierda">

                            <div
                                class="competencia-btn"
                                data-atributo="con"
                                data-habilidad="salvacion"
                            ></div>

                            <span>Tirada de salvación</span>

                        </div>

                        <span
                            class="valor-habilidad"
                            id="salvacion-con"
                        >
                            +0
                        </span>

                    </button>

                </div>

            </section>

                <div class="atributo-cabecera">
                    <h2>Inteligencia</h2>

                    <div class="atributo-valores">

                        <div class="atributo-modificador" id="mod-int">
                            +0
                        </div>

                        <div class="atributo-puntuacion">

                            <label for="int">Puntuación</label>

                            <select id="int">
				<option value="3">3</option>
    				<option value="4">4</option>
 				<option value="5">5</option>
			        <option value="6">6</option>

                    </div>
                </div>

                        <div class="linea-izquierda">
                            <div class="competencia-btn" data-atributo="int" data-habilidad="salvacion"></div>
                            <span>Tirada de salvación</span>
                        </div>

                        <span class="valor-habilidad" id="salvacion-int">
                            +0
                        </span>
                    </button>

                    <button class="linea-habilidad">
                        <div class="linea-izquierda">
                            <div class="competencia-btn" data-atributo="int" data-habilidad="arcano"></div>

                        </div>

                            +0

                            +0
                        </span>
                    </button>

                </div>

            </section>

            <!-- SABIDURÍA -->

                <div class="atributo-cabecera">

                            +0

            <section class="panel atributo-card">

                <div class="atributo-cabecera">

                    <div class="atributo-valores">
